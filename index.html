<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVJC MPC Batch 1993–95</title>
  <meta name="description" content="SVJC MPC Class of 1993–95 — staying connected, three decades on.">
  <meta property="og:title" content="SVJC MPC Batch 1993–95">
  <meta property="og:description" content="Staying connected, three decades on.">
  <meta property="og:image" content="images/group-photo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf7f0;
      --surface: #ffffff;
      --ink: #1f2430;
      --muted: #5d6472;
      --accent: #b4541f;
      --accent-soft: #f3e3d6;
      --line: #e6ddd0;
      --shadow: 0 18px 40px -18px rgba(31, 36, 48, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --surface: #1d2027;
        --ink: #f1ece4;
        --muted: #a8adb8;
        --accent: #e98b52;
        --accent-soft: #2d241e;
        --line: #2c3039;
        --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header { padding: 56px 0 32px; text-align: center; }
    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    .tagline {
      margin-top: 14px;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
    }

    /* Photo */
    .photo-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .photo-fallback {
      display: none;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      border: 2px dashed var(--line);
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
    .photo-card.missing img { display: none; }
    .photo-card.missing .photo-fallback { display: flex; }
    figcaption {
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      padding: 14px 8px 4px;
    }

    /* Meet banner */
    .meet {
      margin: 40px auto 0;
      max-width: 640px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px 22px;
    }
    .meet-date {
      flex-shrink: 0;
      text-align: center;
      font-family: "Fraunces", Georgia, serif;
      line-height: 1;
    }
    .meet-date .mon {
      font-size: 0.8rem;
      font-family: "Inter", sans-serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--accent);
    }
    .meet-date .day { font-size: 2.2rem; font-weight: 700; }
    .meet h2 { font-size: 1.05rem; font-weight: 600; }
    .meet p { font-size: 0.95rem; color: var(--muted); }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 48px 0 32px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer .rule {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 16px;
      border-radius: 2px;
    }

    @media (max-width: 520px) {
      header { padding: 40px 0 24px; }
      .photo-card { padding: 8px; border-radius: 14px; }
      .meet { flex-direction: column; text-align: center; gap: 10px; }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <div class="eyebrow">SVJC · MPC · 1993–95</div>
    <h1>Thirty years on,<br><span>still one batch.</span></h1>
    <p class="tagline">Classmates of the SVJC MPC Class of 1993–95, together again.</p>
  </header>

  <main class="wrap">
    <figure class="photo-card" id="photoCard">
      <img
        src="images/group-photo.jpg"
        alt="Group photo of the SVJC MPC Class of 1993–95"
        onerror="document.getElementById('photoCard').classList.add('missing')">
      <div class="photo-fallback">
        Group photo coming soon — add it at <strong>&nbsp;images/group-photo.jpg</strong>
      </div>
      <figcaption>SVJC MPC Class of 1993–95</figcaption>
    </figure>

    <section class="meet" aria-label="Upcoming meet">
      <div class="meet-date">
        <div class="mon">OCT</div>
        <div class="day">25</div>
      </div>
      <div>
        <h2>Next batch meet — Sunday, October 25, 2026</h2>
        <p>The full batch website is on its way. See you there!</p>
      </div>
    </section>
  </main>

  <footer class="wrap">
    <div class="rule"></div>
    <p>&copy; <span id="yr">2026</span> SVJC MPC Batch 1993–95 · svjc-mpc-93-95.in</p>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
